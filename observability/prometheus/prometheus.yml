# =============================================================================
# prometheus.yml — scrape config for the Marine Data Layer stack.
# API and workers expose /metrics via prometheus_client (pinned in pyproject).
# The OTel Collector re-exports its pipeline metrics on :8889.
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: marine
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: marine-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: marine-api

  # Workers expose a metrics HTTP endpoint on :9100 (prometheus_client).
  - job_name: marine-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - "worker-ingest:9100"
          - "worker-process:9100"
          - "worker-alerts:9100"
        labels:
          component: worker

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  - job_name: nats
    metrics_path: /metrics
    static_configs:
      - targets: ["nats:8222"]
        labels:
          service: nats
