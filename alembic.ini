# =============================================================================
# alembic.ini — migration configuration for the Marine Data Layer schema.
# The sqlalchemy.url is read from the DATABASE_URL env var at runtime by env.py
# (never hard-coded here, so no secrets are committed).
# Migrations create the CANONICAL schema documented in the requirements/source
# mapping. They are intentionally explicit-SQL (not autogenerated) so this
# platform layer does NOT import or depend on backend-owned SQLAlchemy models.
# =============================================================================
[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is injected from DATABASE_URL in migrations/env.py
sqlalchemy.url =

# Timezone for migration timestamps.
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
